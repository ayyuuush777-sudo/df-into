name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-color-emoji \
            fonts-liberation \
            fonts-dejavu-core \
            libgbm-dev \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libxtst6

      - name: Install npm packages
        run: npm install

      - name: Render the video
        run: node render.js

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output.mp4
          retention-days: 7
