name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg xvfb xdotool \
            fonts-noto-color-emoji fonts-liberation fonts-dejavu-core \
            libgbm1 libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgtk-3-0 libnspr4 libnss3 \
            libpango-1.0-0 libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2 libxshmfence1 ca-certificates wget

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Install npm packages
        run: npm install

      - name: Render
        run: |
          Xvfb :99 -screen 0 2560x1450x24 -ac +extension GLX +render -noreset &
          sleep 3
          export DISPLAY=:99
          node render.js

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output.mp4
          retention-days: 7
